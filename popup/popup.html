<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Google Drive Private Video Downloader</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="header hidden">
            <div class="extension-info">
                <img class="extension-icon" title="Google Drive - Private Video Downloader" src="../assets/icon.svg" />
                <div class="extension-title">
                    <h1>Google Drive</h1>
                    <h2>Private Video Downloader</h2>
                </div>
            </div>
            <div class="button-group">
                <button class="reload-button" title="Reload Drive tab" aria-label="Reload Drive tab">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                        <path d="M21 3v5h-5" />
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                        <path d="M8 16H3v5" />
                    </svg>
                </button>
                <button class="state-button button-on" id="button-on">ON</button>
                <button class="state-button button-off" id="button-off" disabled>OFF</button>
            </div>
        </div>

        <div id="only-in-drive-message" class="hidden">Open a Google Drive video or preview to use this extension.</div>
        <div class="download-toolbar">
            <div id="status-message" class="hidden" role="status"></div>
            <button id="download-all" class="download-all hidden">Download All</button>
        </div>
        <div id="download-container" class="hidden"></div>

        <footer>
            <a class="github-link" href="https://github.com/ilmartoo" target="_blank" rel="noreferrer">
                <svg height="22" viewBox="0 0 32 32" width="22" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path clip-rule="evenodd" d="M16.003,0C7.17,0,0.008,7.162,0.008,15.997c0,7.067,4.582,13.063,10.94,15.179c.8.146,1.052-.328,1.052-.752c0-.38.008-1.442,0-2.777c-4.449.967-5.371-2.107-5.371-2.107c-.727-1.848-1.775-2.34-1.775-2.34c-1.452-.992.109-.973.109-.973c1.605.113,2.451,1.649,2.451,1.649c1.427,2.443,3.743,1.737,4.654,1.329c.146-1.034.56-1.739,1.017-2.139c-3.552-.404-7.286-1.776-7.286-7.906c0-1.747.623-3.174,1.646-4.292C7.28,10.464,6.73,8.837,7.602,6.634c0,0,1.343-.43,4.398,1.641c1.276-.355,2.645-.532,4.005-.538c1.359.006,2.727.183,4.005.538c3.055-2.07,4.396-1.641,4.396-1.641c.872,2.203.323,3.83.159,4.234c1.023,1.118,1.644,2.545,1.644,4.292c0,6.146-3.74,7.498-7.304,7.893C19.479,23.548,20,24.508,20,26c0,2,0,3.902,0,4.428c0,.428.258.901,1.07.746C27.422,29.055,32,23.062,32,15.997C32,7.162,24.838,0,16.003,0z" fill="currentColor" fill-rule="evenodd" />
                </svg>
                GitHub
            </a>
        </footer>

        <script type="module" src="popup.js"></script>
    </body>
</html>
